[package]
name = "lun-luxuria"
version = "0.1.0"
description = "Lun'Luxuria, un compagnon vocal sur le poste"
authors = ["Lun-Ecosystem"]
license = "MIT"
repository = "https://github.com/Lun-Ecosystem/lun-luxuria"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lun_luxuria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
