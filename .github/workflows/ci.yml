name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No internal address
        run: |
          git clone --depth 1 https://github.com/Lun-Ecosystem/lun-docs "$RUNNER_TEMP/lun-docs"
          node "$RUNNER_TEMP/lun-docs/tools/check-repo.mjs" --addresses .
      - name: Shared design tokens are in sync
        run: node "$RUNNER_TEMP/lun-docs/tools/sync-tokens.mjs" --check --monde luxuria src/lib/tokens.css
      - name: Shared front kit is in sync
        run: node "$RUNNER_TEMP/lun-docs/tools/sync-kit.mjs" --check src/lib/ui
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|chore|ci|test|refactor)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }

  # The counter-proof: each mutation of the code must make the scenarios fail on its own link.
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No sound tracked by git
        run: |
          if git ls-files | grep -iE '\.(wav|flac|mp3|ogg)$'; then
            echo "A sound is tracked by git: recordings stay out of the repository."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutations

  # The window: Rust side on the system it ships for. The page is built first, the app embeds it.
  window:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
